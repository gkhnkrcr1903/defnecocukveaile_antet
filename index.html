<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#85C7BB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Defne Belge">
  <title>Defne Çocuk ve Aile Belge Uygulaması</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Montserrat:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&family=Open+Sans:wght@400;600;700&family=Outfit:wght@400;600;700&family=Poppins:wght@400;600;700&family=Raleway:wght@400;600;700&family=Roboto:wght@400;500;700&family=Merriweather:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="assets/logo.png" alt="" class="brand-logo">
      <div>
        <h1>Defne Çocuk ve Aile Belge Uygulaması</h1>
        <p>Belgelerinizi antetli kâğıda yerleştirin, PDF olarak indirin veya yazdırın.</p>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="document" role="tab"><span class="ti">📄</span><span>Belge Hazırla</span></button>
      <button class="tab-btn" data-tab="letterhead" role="tab"><span class="ti">🎨</span><span>Antet Düzenle</span></button>
    </nav>
  </header>

  <main>
    <!-- BELGE HAZIRLA -->
    <section id="tab-document" class="tab-panel active">
      <div class="doc-bar">
        <div class="doc-name-wrap">
          <input id="doc-name" class="doc-name" type="text" placeholder="Belge adı" aria-label="Belge adı">
        </div>
        <div class="doc-actions">
          <button id="btn-new" class="btn ghost" title="Yeni boş belge"><span class="bi">＋</span><span>Yeni</span></button>
          <button id="btn-print" class="btn" title="Yazdır"><span class="bi">🖨</span><span>Yazdır</span></button>
          <button id="btn-pdf" class="btn primary" title="Antetli PDF indir"><span class="bi">⬇</span><span>PDF İndir</span></button>
        </div>
      </div>

      <div class="view-switch" data-for="doc-layout" role="tablist">
        <button data-view="edit" class="active">✏️ Düzenle</button>
        <button data-view="preview">👁 Önizleme <span class="badge page-count">1 sayfa</span></button>
      </div>

      <div class="doc-layout" id="doc-layout" data-view="edit">
        <div class="doc-left">
          <label id="dropzone" class="dropzone">
            <input type="file" id="file-input" multiple accept=".docx,.docm,.dotx,.doc,.pdf,.txt,.md,.csv,.html,.htm,.png,.jpg,.jpeg,.gif,.webp">
            <div class="dz-icon">⬆</div>
            <div class="dz-title">Word, PDF, metin veya görsel yükleyin</div>
            <div class="dz-sub"><span class="only-pointer">Sürükleyip bırakın ya da tıklayıp seçin · </span>.docx, .pdf, .txt, .png, .jpg</div>
          </label>

          <div class="card editor-card">
            <div class="toolbar" id="toolbar">
              <select data-block title="Paragraf biçimi">
                <option value="p">Normal metin</option>
                <option value="h1">Başlık 1</option>
                <option value="h2">Başlık 2</option>
                <option value="h3">Başlık 3</option>
              </select>
              <span class="sep"></span>
              <button data-cmd="bold" title="Kalın (Ctrl+B)"><b>K</b></button>
              <button data-cmd="italic" title="İtalik (Ctrl+I)"><i>T</i></button>
              <button data-cmd="underline" title="Altı çizili (Ctrl+U)"><u>A</u></button>
              <input type="color" data-color value="#222222" title="Yazı rengi">
              <span class="sep"></span>
              <button data-cmd="justifyLeft" title="Sola hizala">⯇≡</button>
              <button data-cmd="justifyCenter" title="Ortala">≡</button>
              <button data-cmd="justifyRight" title="Sağa hizala">≡⯈</button>
              <button data-cmd="justifyFull" title="İki yana yasla">☰</button>
              <span class="sep"></span>
              <button data-cmd="insertUnorderedList" title="Madde işaretli liste">•&nbsp;Liste</button>
              <button data-cmd="insertOrderedList" title="Numaralı liste">1.&nbsp;Liste</button>
              <span class="sep"></span>
              <button data-action="date" title="Bugünün tarihini ekle">📅&nbsp;Tarih</button>
              <button data-action="pagebreak" title="Sayfa sonu ekle">⤓&nbsp;Sayfa&nbsp;sonu</button>
              <button data-cmd="removeFormat" title="Biçimi temizle">⌫&nbsp;Biçim</button>
              <span class="sep"></span>
              <button data-cmd="undo" title="Geri al (Ctrl+Z)">↶</button>
              <button data-cmd="redo" title="Yinele (Ctrl+Y)">↷</button>
            </div>
            <div class="editor-scroll">
              <div id="editor" class="doc-content docx editor-paper" contenteditable="true" spellcheck="true"
                   data-placeholder="Buraya yazın ya da yukarıdan bir dosya yükleyin…"></div>
            </div>
          </div>
        </div>

        <div class="doc-right">
          <div class="preview-bar">
            <div class="preview-info">
              <strong>Önizleme</strong>
              <span class="badge page-count">1 sayfa</span>
            </div>
          </div>
          <div id="preview" class="preview-pages"></div>
        </div>
      </div>
    </section>


    <!-- ANTET DÜZENLE -->
    <section id="tab-letterhead" class="tab-panel">
      <div class="view-switch" data-for="lh-layout" role="tablist">
        <button data-view="edit" class="active">⚙️ Ayarlar</button>
        <button data-view="preview">👁 Önizleme</button>
      </div>
      <div class="lh-layout" id="lh-layout" data-view="edit">
        <aside class="lh-side">
          <div class="lh-actions">
            <button id="lh-reset" class="btn ghost">Varsayılana dön</button>
            <button id="lh-export" class="btn ghost">Ayarları kaydet (.json)</button>
            <label class="btn ghost">Ayarları yükle<input type="file" id="lh-import" accept=".json,application/json" hidden></label>
            <button id="lh-blank" class="btn">Boş antetli kâğıt (PDF)</button>
          </div>
          <form id="lh-form" class="lh-form" autocomplete="off"></form>
        </aside>
        <div class="lh-preview-col">
          <div class="preview-bar">
            <div class="preview-info"><strong>Antet önizlemesi</strong>
              <label class="inline-check"><input type="checkbox" id="lh-guides" checked> Metin alanı</label>
              <label class="inline-check"><input type="checkbox" id="lh-second"> 2. sayfa</label>
            </div>
            <span class="muted">Değişiklikler otomatik kaydedilir</span>
          </div>
          <div id="lh-preview" class="preview-pages"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="render-root" aria-hidden="true"></div>
  <div id="docx-style-host"></div>

  <div id="busy" class="busy" hidden>
    <div class="busy-card"><div class="spinner"></div><div id="busy-text">Hazırlanıyor…</div></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/docx-preview.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="assets/defaults-assets.js"></script>
  <script src="js/letterhead.js"></script>
  <script src="js/paginate.js"></script>
  <script src="js/importers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
